on:
  # Run on pushes to tags, the "master" branch, and PR's
  push:
    tags:
      - '**'
    branches:
      - master
  pull_request:

name: CI

jobs:
  # Job key
  ci:
    # Label displayed in UI
    name: CI
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the macOS build if the Linux build fails, etc.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tb-build-type: release
            tb-arch: x64
          - os: macos-15
            tb-build-type: release
            tb-arch: arm64
          - os: macos-15
            tb-build-type: asan
            tb-arch: arm64
          - os: windows-2022
            tb-build-type: release
            tb-arch: x64
            qt-arch: win64_msvc2022_64
    env:
      # Record pull request head commit SHA
      TB_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TB_OS_IMAGE: ${{ matrix.os }}
    steps:
      # See: https://github.com/actions/checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # CPM fetches dependencies; no repository submodules are needed.
          submodules: false

      # CMake 3.28+ is required by CPM's SYSTEM / EXCLUDE_FROM_ALL handling.
      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.2.3'

      # Dependencies

      - name: Install common Linux dependencies
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: |
          sudo apt update
          sudo apt install build-essential libxi-dev libxrandr-dev libxxf86vm-dev freeglut3-dev mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev zlib1g-dev libfontconfig1-dev pandoc p7zip-full ninja-build ccache xvfb

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtmultimedia'
          cache: true

      - name: Install Pandoc (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          # Chocolatey was taking 3 minutes to install pandoc; just install it directly
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/2.11.3.1/pandoc-2.11.3.1-windows-x86_64.zip' -OutFile 'pandoc.zip'
          if ("668A62A8990DEB2753753DF0C8D3F1BE567026FE" -ne (Get-FileHash -Path 'pandoc.zip' -Algorithm SHA1).Hash) { exit }
          7z x pandoc.zip -o'.'
          $tb_pandoc_path = "$(pwd)\pandoc-2.11.3.1"
          # Add this to the system path
          echo "Pandoc path: $tb_pandoc_path"
          # See: https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-commands-for-github-actions#environment-files
          echo "$tb_pandoc_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS dependencies
        if: ${{ matrix.os == 'macos-15' }}
        run: |
          brew install cmake p7zip pandoc ninja ccache

      # Native dependencies now come from pinned CPM sources. Keeping sources
      # and compiler results separate permits clean build directories without
      # downloading or compiling unchanged dependencies every time.
      - name: Cache CPM sources and compiler results
        uses: actions/cache@v4
        with:
          path: |
            .cache/cpm
            .cache/ccache
          key: cpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.tb-arch }}-${{ matrix.tb-build-type }}-${{ hashFiles('cmake/dependencies/*.cmake', 'cmake/CPM.cmake', 'cmake/CompilerCache.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.tb-arch }}-${{ matrix.tb-build-type }}-

      # Run build script

      - name: Linux build
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        run: ./CI-linux.sh

      - name: macOS build
        if: ${{ matrix.os == 'macos-15' }}
        run: |
          if [ '${{ matrix.tb-build-type }}' = 'asan' ]; then
            export TB_DEBUG_BUILD=true
          fi
          TB_BUILD_DIR="$PWD/build" TB_QT_PREFIX="$QT_ROOT_DIR" ./CI-macos.sh

      - name: Windows build
        if: ${{ matrix.os == 'windows-2022' }}
        # Qt 6 uses MSVC 2022 and x64; the former Win32/Qt5 job is retired.
        run: |
          $Env:QT6_INSTALL_DIR = $env:QT_ROOT_DIR
          cmd.exe /c CI-windows.bat
        env:
          TB_ARCH: ${{ matrix.tb-arch }}

      # Upload artifacts.
      # These need to be separate, otherwise all of the artifacts are bundled into
      # one .zip file.

      # win64
      - name: Upload win64 artifact
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'windows-2022' && matrix.tb-arch == 'x64' }}
        with:
          name: win64
          path: |
            cmakebuild/*.7z
            cmakebuild/*.7z.md5

      # Linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        if: ${{ startsWith(matrix.os, 'ubuntu-') }}
        with:
          name: linux
          path: |
            build/*.deb
            build/*.md5

      # macOS
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'macos-15' && matrix.tb-build-type != 'asan' }}
        with:
          name: macos
          path: |
            build/*.dmg
            build/*.md5

      # Create release

      # Official action upload-release-asset doesn't support uploading files
      # based on a glob, so use https://github.com/softprops/action-gh-release
      - name: Release
        uses: softprops/action-gh-release@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.tb-build-type != 'asan' }}
        with:
          draft: true
          files: |
            build/*.deb
            build/*.dmg
            build/*.md5
            cmakebuild/*.7z
            cmakebuild/*.7z.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload compiled manual
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-24.04' }}
        with:
          # I've created a SSH key pair following https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-create-ssh-deploy-key
          # The TrenchBroom/TrenchBroom repo has a repository secret ACTIONS_DEPLOY_KEY set to the SSH private key
          # The TrenchBroom/manual repo has a deploy key set to the SSH public key
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: TrenchBroom/manual # Repo to deploy to
          publish_branch: gh-pages # Branch to deploy to
          publish_dir: ./build/app/gen-manual # Source directory tree
          destination_dir: latest # Deploy to this directory in target repo
